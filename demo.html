<html lang="ko">

      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
      .price { font-size: 24px; font-weight: 600; margin: 4px 0 24px; }

      </div>
      <div class="review">

        <p>이전에 쓰던 것보다 연결이 훨씬 안정적이에요. 재구매 의사 있습니다.</p>
      </div>

      <!-- TrustLabel. The disclosure renders where this tag sits. -->
